<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservasi Tiket Konser</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }

        .form-card {
            background-color: #1e293b;
            padding: 32px;
            border-radius: 16px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }

        .header {
            margin-bottom: 28px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 14px;
            color: #94a3b8;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        .phone-grid {
            display: grid;
            grid-template-columns: 100px 1fr;
            gap: 12px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #cbd5e1;
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="email"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #334155;
            border-radius: 8px;
            background-color: #0f172a;
            color: #f8fafc;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        /* Desain Kustom untuk Pilihan Tempat Duduk */
        .seating-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .seat-box {
            position: relative;
            background-color: #0f172a;
            border: 1px solid #334155;
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .seat-box input[type="radio"] {
            position: absolute;
            opacity: 0;
        }

        .seat-box span {
            font-size: 14px;
            color: #cbd5e1;
            font-weight: 500;
        }

        /* Efek ketika opsi tempat duduk dipilih */
        .seat-box:has(input[type="radio"]:checked) {
            border-color: #38bdf8;
            background-color: rgba(56, 189, 248, 0.08);
        }
        
        .seat-box:has(input[type="radio"]:checked) span {
            color: #38bdf8;
        }

        .seat-box.other-input {
            grid-column: span 2;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .seat-box.other-input input[type="text"] {
            padding: 6px 10px;
            background-color: #1e293b;
        }

        textarea {
            resize: none;
            min-height: 90px;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #0ea5e9;
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #0284c7;
        }
    </style>
</head>
<body>

<div class="form-card">
    <div class="header">
        <h1>Pemesanan tiket konser</h1>
        <p>Silakan lengkapi formulir di bawah ini.</p>
    </div>
    
    <form action="#" method="POST">
        <!-- Grid Nama Depan dan Belakang -->
        <div class="form-group-grid">
            <div>
                <label for="first_name">Nama Depan</label>
                <input type="text" id="first_name" name="first_name" required>
            </div>
            <div>
                <label for="last_name">Nama Belakang</label>
                <input type="text" id="last_name" name="last_name" required>
            </div>
        </div>

        <!-- Input Email -->
        <div class="form-group">
            <label for="email">Alamat E-mail</label>
            <input type="email" id="email" name="email" placeholder="nama@email.com" required>
        </div>

        <!-- Input Telepon -->
        <div class="form-group">
            <label for="phone">Nomor Telepon</label>
            <div class="phone-grid">
                <input type="text" id="area_code" name="area_code" placeholder="+62" required>
                <input type="text" id="phone_num" name="phone_num" placeholder="812xxxxxx" required>
            </div>
        </div>

        <!-- Pilihan Tempat Duduk Model Cards -->
        <div class="form-group">
            <label>Pilihan Tempat Duduk</label>
            <div class="seating-options">
                <label class="seat-box">
                    <input type="radio" name="seat" value="Depan" required>
                    <span>Panggung Depan</span>
                </label>
                <label class="seat-box">
                    <input type="radio" name="seat" value="Tengah">
                    <span>Bagian Tengah</span>
                </label>
                <label class="seat-box">
                    <input type="radio" name="seat" value="Balkon">
                    <span>Area Balkon</span>
                </label>
                <div class="seat-box other-input">
                    <label style="margin-bottom: 0; cursor: pointer; display: flex; align-items: center; gap: 8px;">
                        <input type="radio" name="seat" value="Lainnya">
                        <span>Lainnya:</span>
                    </label>
                    <input type="text" name="seat_other" placeholder="Tulis custom area...">
                </div>
            </div>
        </div>

        <!-- Jumlah Tiket -->
        <div class="form-group">
            <label for="quantity">Jumlah Tiket</label>
            <input type="number" id="quantity" name="quantity" min="1" placeholder="Masukkan jumlah tiket" required>
        </div>

        <!-- Catatan Tambahan -->
        <div class="form-group">
            <label for="notes">Catatan atau Pertanyaan</label>
            <textarea id="notes" name="notes" placeholder="Tulis pesan Anda di sini..."></textarea>
        </div>

        <!-- Tombol Kirim -->
        <button type="submit" class="btn-submit">Konfirmasi Pemesanan</button>
    </form>
</div>

</body>
</html>
